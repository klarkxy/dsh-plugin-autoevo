<style>
  :root {
    color-scheme: light dark;

  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1114; --card: #181c21; --text: #e8eaed; --muted: #9aa4b0;
      --border: #2a313a; --accent: #6d9dff;

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 24px; background: var(--bg); color: var(--text);

  }

  .card {

    border-radius: 12px; padding: 20px 24px; margin-bottom: 16px;
  }
  .card h2 { font-size: 1.1rem; margin: 0 0 12px; }
  .links { display: flex; gap: 12px; font-size: 0.9rem; }
  .links a {
    color: var(--accent); border: 1px solid var(--border); border-radius: 999px;
    padding: 2px 14px; text-decoration: none;
    transition: border-color .15s ease, background .15s ease;
  }
  .links a:hover { border-color: var(--accent); }
  footer { margin-top: 40px; font-size: 0.85rem; color: var(--muted); }
  footer a { color: var(--accent); text-decoration: none; }
