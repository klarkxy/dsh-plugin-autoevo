name: Publish npm package

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'klarkxy/dsh-plugin-autoevo' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.29.2
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.16.0
          registry-url: https://registry.npmjs.org/
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:fast
      - run: pnpm test:integration
      - run: pnpm test:loader && pnpm test:packaged
      - name: Publish and confirm exact archive
        run: node scripts/publish-npm.mjs --publish
        env:
          # Required only for first publication; remove after binding npm trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Preserve archive and publication receipt
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: npm-release-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            .pack/npm-release/*.tgz
            .pack/npm-release/report.json
