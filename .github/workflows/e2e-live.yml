name: Live E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  live-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.29.2
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:e2e:live
