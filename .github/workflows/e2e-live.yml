name: Live E2E

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      GH_TOKEN: ${{ github.token }}
      AUTOEVO_CANARY_REQUIREMENT: ${{ vars.AUTOEVO_CANARY_REQUIREMENT }}
      AUTOEVO_CANARY_REPOSITORY: ${{ vars.AUTOEVO_CANARY_REPOSITORY }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.29.2
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate anonymous canary configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AUTOEVO_CANARY_REQUIREMENT)) { throw 'AUTOEVO_CANARY_REQUIREMENT repository variable is required' }
          if ($env:AUTOEVO_CANARY_REPOSITORY -notmatch '^[\w.-]+/[\w.-]+$') { throw 'AUTOEVO_CANARY_REPOSITORY must be owner/repository' }
      - name: Restore the frozen DSH runtime fixture
        id: dsh-runtime-cache
        uses: actions/cache@v4.2.4
        with:
          path: ${{ runner.temp }}/autoevo-dsh-harness
          key: dsh-runtime-${{ runner.os }}-node-24-0.1.1-rc.2-v1
      - name: Install the frozen DSH runtime fixture
        if: steps.dsh-runtime-cache.outputs.cache-hit != 'true'
        run: npm install --prefix "$env:RUNNER_TEMP\\autoevo-dsh-harness" --no-save --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.1.1-rc.2
      - run: '"DSH_PACKAGE_ROOT=$env:RUNNER_TEMP\\autoevo-dsh-harness\\node_modules\\@deepseek-ai\\dsh" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - run: pnpm build
      - run: pnpm test:e2e:live
