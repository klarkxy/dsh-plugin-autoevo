name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast-checks:
    name: Ubuntu / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        node: ['22.19.0', '24']
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.29.2
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the full fast check
        if: matrix.node == '24'
        run: pnpm check:fast
      - name: Verify the oldest supported Node release
        if: matrix.node != '24'
        run: pnpm test
      - name: Verify the package contents
        if: matrix.node == '24'
        run: pnpm pack:dry-run
