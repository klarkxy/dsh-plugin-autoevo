name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-matrix:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # The frozen Windows DSH fixture has a large dependency closure and can
    # take more than 20 minutes to install on a cold hosted runner.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [22.19.0, 24]
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.29.2
          run_install: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the frozen DSH runtime fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm install --prefix "$env:RUNNER_TEMP\autoevo-dsh-harness" --no-save --ignore-scripts @deepseek-ai/dsh@0.1.1-rc.2
      - name: Bind the DSH runtime fixture
        if: runner.os == 'Windows'
        shell: pwsh
        run: '"DSH_PACKAGE_ROOT=$env:RUNNER_TEMP\autoevo-dsh-harness\node_modules\@deepseek-ai\dsh" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'
      - run: pnpm check:fast
      - run: pnpm pack:dry-run
      - name: Run the complete offline DSH flow
        if: runner.os == 'Windows'
        run: pnpm test:e2e:offline
