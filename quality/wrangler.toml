name = "autoevo-quality"
main = "src/index.ts"
compatibility_date = "2026-08-17"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "autoevo-quality"
database_id = "replace-with-d1-id"

# Optional. Without it, GET rebuilds the snapshot from D1 on a cache miss.
# [[r2_buckets]]
# binding = "SNAPSHOT"
# bucket_name = "autoevo-quality-snapshot"

[triggers]
crons = ["17 3 * * *"]
